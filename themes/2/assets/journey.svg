<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="1000" height="310" role="img" aria-label="Journey: Physics to Mathematics to Programming to AI/ML to Deep Learning to Research, then the KCN_LAB loop: explore, build, experiment, repeat">
<title>KCN_LAB :: JOURNEY</title>
<style>
  text { font-family: 'JetBrains Mono','Fira Code','SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace; }
  .flow { animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -18 } }
  .orbit { animation: orbit 5s linear infinite; }
  @keyframes orbit { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -1100.5 } }
  .st { animation: st 4s ease-in-out infinite; }
  @keyframes st { 0%,100% { stroke-opacity: .45 } 12% { stroke-opacity: 1 } 30% { stroke-opacity: .45 } }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0 } }
  .n0{animation:n0 7.0s linear infinite}@keyframes n0{0%,0.0%{stroke-opacity:.35;fill-opacity:.04}0.0%{stroke-opacity:1;fill-opacity:.22}14.0%,100%{stroke-opacity:.35;fill-opacity:.04}}.n1{animation:n1 7.0s linear infinite}@keyframes n1{0%,12.8%{stroke-opacity:.35;fill-opacity:.04}14.8%{stroke-opacity:1;fill-opacity:.22}28.8%,100%{stroke-opacity:.35;fill-opacity:.04}}.n2{animation:n2 7.0s linear infinite}@keyframes n2{0%,27.5%{stroke-opacity:.35;fill-opacity:.04}29.5%{stroke-opacity:1;fill-opacity:.22}43.5%,100%{stroke-opacity:.35;fill-opacity:.04}}.n3{animation:n3 7.0s linear infinite}@keyframes n3{0%,42.3%{stroke-opacity:.35;fill-opacity:.04}44.3%{stroke-opacity:1;fill-opacity:.22}58.3%,100%{stroke-opacity:.35;fill-opacity:.04}}.n4{animation:n4 7.0s linear infinite}@keyframes n4{0%,57.0%{stroke-opacity:.35;fill-opacity:.04}59.0%{stroke-opacity:1;fill-opacity:.22}73.0%,100%{stroke-opacity:.35;fill-opacity:.04}}.n5{animation:n5 7.0s linear infinite}@keyframes n5{0%,71.8%{stroke-opacity:.35;fill-opacity:.04}73.8%{stroke-opacity:1;fill-opacity:.22}87.8%,100%{stroke-opacity:.35;fill-opacity:.04}}
</style>
