  <linearGradient id="tg" gradientUnits="userSpaceOnUse" x1="430" y1="0" x2="570" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#00FF9C"/><stop offset="1" stop-color="#A3FF12"/>
