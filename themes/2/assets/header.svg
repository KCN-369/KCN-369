<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="KCN_LAB - Kanhu Nayak - Physics x AI/ML x Quantum Computing x Open Source">
<title>KCN_LAB :: KANHU NAYAK</title>
<style>
  text { font-family: 'JetBrains Mono','Fira Code','SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace; }
  .tw { animation: tw 4s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15 } 50% { opacity: 1 } }
  .trail { animation: trail 3s linear infinite; }
  @keyframes trail { to { stroke-dashoffset: -660 } }
  .spin { animation: spin 40s linear infinite; transform-origin: 150px 150px; }
  @keyframes spin { to { transform: rotate(360deg) } }
  .nuc { animation: nuc 2.4s ease-in-out infinite; transform-origin: 150px 150px; }
  @keyframes nuc { 0%,100% { transform: scale(1) } 50% { transform: scale(1.18) } }
  .scan { animation: scan 7s linear infinite; }
  @keyframes scan { from { transform: translateY(-20px) } to { transform: translateY(320px) } }
  .grid { animation: grid 12s linear infinite; }
  @keyframes grid { to { transform: translate(40px, 40px) } }
  .blink { animation: blink 1.05s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0 } }
  .in { animation: in .9s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes in { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
  .gA { animation: gA 5s steps(1) infinite; }
  .gB { animation: gB 5s steps(1) infinite; }
  @keyframes gA { 0%,86%,100% { opacity: 0; transform: none } 87% { opacity: .9; transform: translate(-5px, 1px) } 89% { opacity: .9; transform: translate(3px, -2px) } 91% { opacity: .9; transform: translate(-2px, 0) } 93% { opacity: 0 } }
  @keyframes gB { 0%,86%,100% { opacity: 0; transform: none } 87% { opacity: .9; transform: translate(5px, -1px) } 89% { opacity: .9; transform: translate(-3px, 2px) } 91% { opacity: .9; transform: translate(2px, 0) } 93% { opacity: 0 } }
  .main { animation: shake 5s steps(1) infinite; }
  @keyframes shake { 0%,86%,100% { transform: none } 88% { transform: translate(1px, 0) skewX(-4deg) } 90% { transform: translate(-1px, 0) skewX(3deg) } 92% { transform: none } }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
</style>
<defs>
