name: profile-assets

# Regenerates every dynamic card shown in README.md from REAL GitHub data:
#   profile/stats.svg       GitHub telemetry (tiles, LEVEL ring, XP, stats)
#   profile/top-langs.svg   top languages card
#   profile/contrib3d.svg   3D isometric contribution graph (hover to rotate)
#   profile/flow.svg        animated weekly-waveform + day-matrix graph
#   docs/data/contrib.json  payload for the interactive 3D viewer (GitHub Pages)
# Static artwork in assets/ is rebuilt by scripts/build_assets.py.
#
# Optional: add a classic Personal Access Token as the repo secret PROFILE_TOKEN
# (scope: read:user) to include private contributions in the numbers.

on:
  # GitHub's floor for scheduled workflows is once every 5 minutes, and
  # scheduled runs are best-effort — under load GitHub can add several
  # minutes of delay, so a fresh commit normally shows up in roughly
  # 5-15 minutes.  For a truly instant refresh, use the Actions tab ->
  # "profile-assets" -> "Run workflow" (workflow_dispatch, below).
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-assets.yml"
      - "README.md"
      - "scripts/**"
      - "assets/**"
      - "profile/**"
      - "docs/data/**"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build static artwork
        run: python3 scripts/build_assets.py

      - name: Generate live cards
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/profile_cards.py \
            --user "${{ github.repository_owner }}" \
            --out profile \
            --data-out docs/data \
          || echo "::warning::card generation failed — keeping the previous cards"

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets profile docs/data
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(profile): refresh cards [skip ci]"
          git push
