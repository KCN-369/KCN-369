name: profile-assets

# Regenerates the dynamic cards shown in README.md:
#   profile/stats.svg      -> GitHub stats card
#   profile/top-langs.svg  -> top languages card
#   profile/snake.svg      -> contribution-graph snake animation
# Everything is committed back to this repository, so the README never
# depends on a third-party stats server being online.

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-assets.yml"
      - "README.md"
      - "assets/**"
      - "themes/palettes.json"
      - "scripts/build_themes.py"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_border=true&bg_color=0B1020&title_color=00F0FF&icon_color=FF2BD6&text_color=E6EDF3&ring_color=8B5CF6&border_radius=12
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&bg_color=0B1020&title_color=00F0FF&text_color=E6EDF3&border_radius=12&card_width=495
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?palette=github-dark&color_snake=#00F0FF&color_dots=#161B22,#3B1F5C,#6D28D9,#C026D3,#FF2BD6

      - name: Build themes (Theme 2, 3, ... from palettes.json)
        run: python3 scripts/build_themes.py

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg README.md themes
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(profile): refresh README cards [skip ci]"
          git push
