<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 34" width="1000" height="34" role="img" aria-label="decorative divider">
<title>KCN_LAB :: DIVIDER</title>
<style>
  text { font-family: 'JetBrains Mono','Fira Code','SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace; }
  .spin { animation: spin 18s linear infinite; transform-box: fill-box; transform-origin: center; }
  .spin-s { animation: spin 9s linear infinite reverse; transform-box: fill-box; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg) } }
  .blink { animation: blink 1.05s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0 } }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  .rise { animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }
  .sweep { animation: sweep 5s cubic-bezier(.4,0,.6,1) infinite; }
  @keyframes sweep { 0% { transform: translateX(-260px) } 55%,100% { transform: translateX(1100px) } }

  .sweep { animation: sweep 6s cubic-bezier(.4,0,.6,1) infinite; }
  @keyframes sweep { 0% { transform: translateX(-160px) } 60%,100% { transform: translateX(1060px) } }
</style>
<defs>
  <linearGradient id="holo" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22D3EE"/><stop offset=".38" stop-color="#60A5FA"/>
    <stop offset=".68" stop-color="#A78BFA"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
  <linearGradient id="holoV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#A78BFA"/><stop offset=".55" stop-color="#60A5FA"/>
    <stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F4F8FE"/></linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".85"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#0E7490" stroke-opacity=".07"/></pattern>
  <radialGradient id="gc"><stop offset="0" stop-color="#22D3EE" stop-opacity=".22"/>
    <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
  <radialGradient id="gv"><stop offset="0" stop-color="#A78BFA" stop-opacity=".20"/>
    <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
  <radialGradient id="gm"><stop offset="0" stop-color="#F472B6" stop-opacity=".18"/>
    <stop offset="1" stop-color="#F472B6" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="7"/></filter>
</defs>
<line x1="0" y1="17.0" x2="1000" y2="17.0" stroke="url(#holo)" stroke-width="2" stroke-opacity=".55"/>
<line x1="0" y1="17.0" x2="1000" y2="17.0" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="60 900" class="sweep" opacity=".9"/>
<path d="M140,8.0 L152,17.0 L140,26.0 Z" fill="#7C3AED" fill-opacity=".55"/>
<path d="M860,8.0 L872,17.0 L860,26.0 Z" fill="#7C3AED" fill-opacity=".55"/>
<rect x="454.0" y="6.0" width="92" height="22" rx="11" fill="#FFFFFF" stroke="#D8E4F4"/>
<circle cx="470.0" cy="17.0" r="3.4" fill="#0E7490"/>
<circle cx="500.0" cy="17.0" r="3.4" fill="#7C3AED"/>
<circle cx="530.0" cy="17.0" r="3.4" fill="#DB2777"/>
</svg>
