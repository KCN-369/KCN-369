<style>
  text { font-family: 'JetBrains Mono','Fira Code','SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace; }
  .row { animation: row .6s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes row { from { opacity: 0; transform: translateX(-16px) } to { opacity: 1; transform: none } }
  .ring { animation: ring 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes ring { 0% { transform: scale(.6); opacity: .9 } 100% { transform: scale(2.1); opacity: 0 } }
  .hl { animation: hl 7.2s ease-in-out infinite; }
  @keyframes hl { 0%,100% { fill-opacity: 0 } 6% { fill-opacity: .10 } 14% { fill-opacity: 0 } }
  .bar { animation: bar 9s cubic-bezier(.3,.9,.3,1) infinite; transform-box: fill-box; transform-origin: left center; }
  @keyframes bar { 0% { transform: scaleX(0) } 18%,92% { transform: scaleX(1) } 100% { transform: scaleX(0) } }
  .shine { animation: shine 3s ease-in-out infinite; }
  @keyframes shine { 0% { transform: translateX(0) } 60%,100% { transform: translateX(280px) } }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0 } }
</style>
