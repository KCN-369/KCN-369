<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 148 132" width="148" height="132"
     role="img" aria-label="JAVASCRIPT">
<title>JAVASCRIPT</title>
<style>
  text { font-family: 'JetBrains Mono','Fira Code','SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace; }
  .in { animation: rise .75s cubic-bezier(.2,.85,.25,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.94) }
                    to   { opacity: 1; transform: none } }
  .fl { animation: float 7.5s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-2.6px) } }
  .tile { transition: transform .38s cubic-bezier(.2,.85,.25,1); transform-origin: 74px 69px; }
  .tile:hover { transform: translateY(-6px) scale(1.035); }
  .card { stroke: #D8E4F4; stroke-width: 1.4; transition: stroke .32s ease; }
  .tile:hover .card { stroke: #0E7490; stroke-width: 1.8; }
  .bar { transform: scaleX(.3); transform-origin: 6px 13.8px;
          transition: transform .5s cubic-bezier(.2,.85,.25,1); }
  .tile:hover .bar { transform: scaleX(1); }
  .glow { opacity: 0; transition: opacity .35s ease; }
  .tile:hover .glow { opacity: .5; }
  .ring { opacity: 0; transition: opacity .35s ease; transform-origin: 74px 58px;
           animation: spin 14s linear infinite; animation-play-state: paused; }
  .tile:hover .ring { opacity: .95; animation-play-state: running; }
  .icon { transition: transform .38s cubic-bezier(.2,.85,.25,1); transform-origin: 74px 58px; }
  .tile:hover .icon { transform: scale(1.12); }
  .lbl { transition: fill .32s ease; }
  .tile:hover .lbl { fill: #0E7490; }
  .hint { opacity: 0; transition: opacity .35s ease; }
  .tile:hover .hint { opacity: 1; }
  .sheen { opacity: 0; }
  .tile:hover .sheen { animation: sheen .95s linear infinite; }
  @keyframes sheen { 0% { transform: translateX(-70px) } 100% { transform: translateX(150px) } }
  .tick { animation: pulse 2.6s ease-in-out infinite; }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F4F8FE"/></linearGradient>
  <radialGradient id="gl" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#968712" stop-opacity=".38"/>
    <stop offset="1" stop-color="#968712" stop-opacity="0"/></radialGradient>
  <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".9"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
</defs>
<g class="in" transform="translate(0 0)" style="animation-delay:0.18s">
<g class="fl" transform="translate(0 0)" style="animation-delay:-0.34s">
<g class="tile">
  <rect class="card" x="6" y="12" width="136" height="114" rx="15" fill="url(#bg)"/>
  <rect class="bar" x="6" y="12" width="136" height="3.6" rx="1.8" fill="#968712"/>
  <circle class="glow" cx="74.0" cy="58.0" r="40" fill="url(#gl)"/>
  <circle class="ring" cx="74.0" cy="58.0" r="29" fill="none" stroke="#968712" stroke-width="1.2"
          stroke-dasharray="5 6" stroke-opacity=".75"/>
  <g class="icon" transform="translate(52.00 36.00) scale(1.83333)">
    <g transform="translate(-0.0 -0.0)"><path fill="#968712" d="M0 0h24v24H0V0zm22.034 18.276c-.175-1.095-.888-2.015-3.003-2.873-.736-.345-1.554-.585-1.797-1.14-.091-.33-.105-.51-.046-.705.15-.646.915-.84 1.515-.66.39.12.75.42.976.9 1.034-.676 1.034-.676 1.755-1.125-.27-.42-.404-.601-.586-.78-.63-.705-1.469-1.065-2.834-1.034l-.705.089c-.676.165-1.32.525-1.71 1.005-1.14 1.291-.811 3.541.569 4.471 1.365 1.02 3.361 1.244 3.616 2.205.24 1.17-.87 1.545-1.966 1.41-.811-.18-1.26-.586-1.755-1.336l-1.83 1.051c.21.48.45.689.81 1.109 1.74 1.756 6.09 1.666 6.871-1.004.029-.09.24-.705.074-1.65l.046.067zm-8.983-7.245h-2.248c0 1.938-.009 3.864-.009 5.805 0 1.232.063 2.363-.138 2.711-.33.689-1.18.601-1.566.48-.396-.196-.597-.466-.83-.855-.063-.105-.11-.196-.127-.196l-1.825 1.125c.305.63.75 1.172 1.324 1.517.855.51 2.004.675 3.207.405.783-.226 1.458-.691 1.811-1.411.51-.93.402-2.07.397-3.346.012-2.054 0-4.109 0-6.179l.004-.056z"/></g>
  </g>
  <text class="lbl" x="74.0" y="98" font-size="11" fill="#3D4B63" text-anchor="middle"
        letter-spacing=".7" font-weight="600">JAVASCRIPT</text>
  <text class="hint" x="74.0" y="114" font-size="7" fill="#968712" text-anchor="middle"
        letter-spacing="1.6">OPEN DOCS &#8599;</text>
  <path class="sheen" d="M6 27 L20 12 L34 12 L20 27 Z" fill="url(#sh)"/>
  <circle class="tick" cx="18" cy="22" r="1.7" fill="#968712" style="animation-delay:-0.18s"/>
</g></g></g>
</svg>
