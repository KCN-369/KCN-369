<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 132" width="132" height="132"
     role="img" aria-label="OPENCV">
<title>OPENCV</title>
<style>
  text { font-family: 'JetBrains Mono','Fira Code','SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace; }
  .in { animation: rise .75s cubic-bezier(.2,.85,.25,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.94) }
                    to   { opacity: 1; transform: none } }
  .fl { animation: float 7.5s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-2.6px) } }
  .tile { transition: transform .38s cubic-bezier(.2,.85,.25,1); transform-origin: 66px 69px; }
  .tile:hover { transform: translateY(-6px) scale(1.035); }
  .card { stroke: #D8E4F4; stroke-width: 1.4; transition: stroke .32s ease; }
  .tile:hover .card { stroke: #0E7490; stroke-width: 1.8; }
  .bar { transform: scaleX(.3); transform-origin: 6px 13.8px;
          transition: transform .5s cubic-bezier(.2,.85,.25,1); }
  .tile:hover .bar { transform: scaleX(1); }
  .glow { opacity: 0; transition: opacity .35s ease; }
  .tile:hover .glow { opacity: .5; }
  .ring { opacity: 0; transition: opacity .35s ease; transform-origin: 66px 58px;
           animation: spin 14s linear infinite; animation-play-state: paused; }
  .tile:hover .ring { opacity: .95; animation-play-state: running; }
  .icon { transition: transform .38s cubic-bezier(.2,.85,.25,1); transform-origin: 66px 58px; }
  .tile:hover .icon { transform: scale(1.12); }
  .lbl { transition: fill .32s ease; }
  .tile:hover .lbl { fill: #0E7490; }
  .hint { opacity: 0; transition: opacity .35s ease; }
  .tile:hover .hint { opacity: 1; }
  .sheen { opacity: 0; }
  .tile:hover .sheen { animation: sheen .95s linear infinite; }
  @keyframes sheen { 0% { transform: translateX(-70px) } 100% { transform: translateX(150px) } }
  .tick { animation: pulse 2.6s ease-in-out infinite; }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F4F8FE"/></linearGradient>
  <radialGradient id="gl" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#5C3EE8" stop-opacity=".38"/>
    <stop offset="1" stop-color="#5C3EE8" stop-opacity="0"/></radialGradient>
  <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".9"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
</defs>
<g class="in" transform="translate(0 0)" style="animation-delay:0.30s">
<g class="fl" transform="translate(0 0)" style="animation-delay:-0.57s">
<g class="tile">
  <rect class="card" x="6" y="12" width="120" height="114" rx="15" fill="url(#bg)"/>
  <rect class="bar" x="6" y="12" width="120" height="3.6" rx="1.8" fill="#5C3EE8"/>
  <circle class="glow" cx="66.0" cy="58.0" r="40" fill="url(#gl)"/>
  <circle class="ring" cx="66.0" cy="58.0" r="29" fill="none" stroke="#5C3EE8" stroke-width="1.2"
          stroke-dasharray="5 6" stroke-opacity=".75"/>
  <g class="icon" transform="translate(44.00 36.00) scale(1.83333)">
    <g transform="translate(-0.0 -0.0)"><path fill="#5C3EE8" d="M11.8992.8525C8.735.8525 6.17 3.4175 6.17 6.5817c0 2.102 1.1321 3.9398 2.8198 4.9366l1.6412-2.7849c.0411-.0699.0176-.1593-.0495-.2048-.6233-.4227-1.0328-1.137-1.0328-1.947 0-1.298 1.0524-2.3504 2.3505-2.3504 1.2981 0 2.3505 1.0524 2.3505 2.3505 0 .8098-.4095 1.5242-1.0328 1.947-.0671.0454-.0907.1348-.0495.2047l1.6414 2.785c1.6878-.9969 2.8199-2.8346 2.8199-4.9367 0-3.1642-2.5653-5.7292-5.7295-5.7292zm-6.17 10.8366C2.565 11.6891 0 14.2541 0 17.4183c0 3.1642 2.565 5.7292 5.7292 5.7292 3.1798 0 5.8074-2.6995 5.7275-5.8762H8.2313c-.0847 0-.1513.0717-.1519.1564-.0082 1.266-1.0644 2.3411-2.3502 2.3411-1.2981 0-2.3505-1.0524-2.3505-2.3505 0-1.2982 1.0524-2.3505 2.3505-2.3505.34 0 .663.0724.9547.2022.0713.0318.1566.0077.1962-.0595l1.6464-2.7935c-.8273-.4636-1.7815-.7279-2.7973-.7279zm15.4424.7614l-1.6366 2.7878c-.041.07-.0172.1594.05.2048.624.4217 1.0348 1.1354 1.0363 1.9452.0022 1.298-1.0483 2.352-2.3465 2.3542-1.298.0023-2.3523-1.0482-2.3545-2.3462-.0015-.8098.4068-1.5248 1.0294-1.9486.067-.0457.0905-.1353.0492-.2051l-1.6464-2.7818c-1.6859.9998-2.8146 2.8394-2.811 4.9415.0056 3.1641 2.575 5.7248 5.7393 5.7192 3.1641-.0054 5.7246-2.575 5.7192-5.7392-.0037-2.1022-1.139-3.938-2.8284-4.9318z"/></g>
  </g>
  <text class="lbl" x="66.0" y="98" font-size="11" fill="#3D4B63" text-anchor="middle"
        letter-spacing=".7" font-weight="600">OPENCV</text>
  <text class="hint" x="66.0" y="114" font-size="7" fill="#5C3EE8" text-anchor="middle"
        letter-spacing="1.6">OPEN DOCS &#8599;</text>
  <path class="sheen" d="M6 27 L20 12 L34 12 L20 27 Z" fill="url(#sh)"/>
  <circle class="tick" cx="18" cy="22" r="1.7" fill="#5C3EE8" style="animation-delay:-0.30s"/>
</g></g></g>
</svg>
