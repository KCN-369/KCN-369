  </g>
  <text class="lbl" x="74.0" y="98" font-size="11" fill="#3D4B63" text-anchor="middle"
        letter-spacing=".7" font-weight="600">ANACONDA</text>
  <text class="hint" x="74.0" y="114" font-size="7" fill="#3A8F2B" text-anchor="middle"
        letter-spacing="1.6">OPEN DOCS &#8599;</text>
  <path class="sheen" d="M6 27 L20 12 L34 12 L20 27 Z" fill="url(#sh)"/>
  <circle class="tick" cx="18" cy="22" r="1.7" fill="#3A8F2B" style="animation-delay:-0.42s"/>
</g></g></g>
</svg>
