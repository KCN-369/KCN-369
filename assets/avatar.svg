<polygon points="349.9,295.0 220.0,370.0 90.1,295.0 90.1,145.0 220.0,70.0 349.9,145.0" fill="none" stroke="#7C3AED" stroke-opacity=".35" stroke-width="1" stroke-dasharray="4 7" class="spin" style="animation-duration:40s"/>
